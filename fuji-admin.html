<!DOCTYPE html>
<html lang="th" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuji Admin Panel — ระบบตอบแชท</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
    <style>
        body {
            font-family: 'Noto Sans Thai', 'Noto Sans Lao', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.7);
        }

        .session-item {
            transition: all 0.15s ease;
            border-left: 4px solid transparent;
        }

        .session-item:hover {
            background: rgba(30, 41, 59, 0.8);
        }

        .session-item.active {
            border-left-color: #f59e0b;
            background: rgba(30, 41, 59, 0.95);
        }

        .msg-in {
            animation: msgIn 0.3s ease-out forwards;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .unread-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(244, 63, 94, 0);
            }
        }

        .online-dot {
            animation: blink 1.5s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- ===== LOGIN SCREEN ===== -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-amber-500/30 rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div
                    class="w-16 h-16 bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-headset text-white text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold text-amber-400">Fuji Admin Panel</h1>
                <p class="text-xs text-slate-400 mt-1">ระบบตอบแชทลูกค้า</p>
            </div>
            <form id="login-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">อีเมล</label>
                    <input type="email" id="login-email" required autocomplete="username"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400"
                        placeholder="admin@fuji.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-password" required autocomplete="current-password"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400"
                        placeholder="••••••••">
                </div>
                <div id="login-error"
                    class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-lg p-2"></div>
                <button type="submit" id="login-btn"
                    class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold py-2.5 rounded-lg transition shadow-lg shadow-amber-500/30 active:scale-95">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ
                </button>
            </form>
            <p class="text-[10px] text-slate-500 text-center mt-4">
                <i class="fa-solid fa-shield-halved mr-1"></i> ระบบนี้สำหรับแอดมินร้านฟูจิเท่านั้น
            </p>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="app-screen" class="hidden h-screen flex flex-col">

        <!-- Top Bar -->
        <header
            class="bg-slate-900 border-b border-slate-800 px-3 sm:px-5 py-2.5 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-headset text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-amber-400 text-sm sm:text-base">Fuji Admin Panel</h1>
                    <p class="text-[10px] text-slate-500" id="header-info">กำลังโหลด...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div id="audio-toggle"
                    class="hidden sm:flex items-center gap-1.5 text-[10px] px-2.5 py-1.5 rounded-lg border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 cursor-pointer"
                    onclick="toggleSound()">
                    <i class="fa-solid fa-volume-high"></i> <span>เสียง</span>
                </div>
                <div
                    class="text-[10px] px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 hidden sm:block">
                    <i class="fa-solid fa-user-shield mr-1 text-indigo-400"></i> <span id="admin-email-label"></span>
                </div>
                <button onclick="logout()"
                    class="text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 px-3 py-1.5 rounded-lg transition active:scale-95">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> ออก
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">

            <!-- Sidebar: Sessions List -->
            <aside id="sidebar"
                class="w-full sm:w-80 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300">
                <div class="p-3 border-b border-slate-800">
                    <div class="relative">
                        <i
                            class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="text" id="search-sessions" oninput="filterSessions()"
                            placeholder="ค้นหา session..."
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-xs focus:outline-none focus:border-amber-400">
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="setFilter('all')" data-filter="all"
                            class="filter-btn flex-1 text-[10px] py-1.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium">ทั้งหมด</button>
                        <button onclick="setFilter('unread')" data-filter="unread"
                            class="filter-btn flex-1 text-[10px] py-1.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ยังไม่อ่าน</button>
                        <button onclick="setFilter('online')" data-filter="online"
                            class="filter-btn flex-1 text-[10px] py-1.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ออนไลน์</button>
                    </div>
                </div>
                <div id="session-list" class="flex-1 overflow-y-auto">
                    <div class="text-center py-8 text-xs text-slate-500">
                        <i class="fa-solid fa-circle-notch animate-spin"></i> กำลังโหลด...
                    </div>
                </div>
            </aside>

            <!-- Chat Panel -->
            <main id="chat-panel" class="hidden sm:flex flex-1 flex-col bg-slate-950 relative">

                <!-- Empty state -->
                <div id="empty-state" class="flex-1 flex items-center justify-center text-center p-6">
                    <div>
                        <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-comments text-slate-600 text-3xl"></i>
                        </div>
                        <p class="text-slate-400 text-sm">เลือก session จากรายการด้านซ้าย</p>
                        <p class="text-slate-600 text-xs mt-1">เพื่อดูแชทและตอบกลับลูกค้า</p>
                    </div>
                </div>

                <!-- Active chat -->
                <div id="active-chat" class="hidden flex-1 flex flex-col">

                    <!-- Chat header -->
                    <div
                        class="bg-slate-900 border-b border-slate-800 px-3 sm:px-5 py-2.5 flex items-center justify-between shrink-0">
                        <div class="flex items-center gap-2 min-w-0">
                            <button onclick="closeChat()"
                                class="sm:hidden p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </button>
                            <div
                                class="w-9 h-9 rounded-full bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-user text-white text-xs"></i>
                            </div>
                            <div class="min-w-0">
                                <p id="chat-session-id" class="font-bold text-sm text-cyan-300 truncate"></p>
                                <p id="chat-last-active" class="text-[10px] text-slate-500 truncate"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span id="chat-online"
                                class="hidden text-[10px] px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                                <i class="fa-solid fa-circle text-[6px] online-dot mr-1"></i> ออนไลน์
                            </span>
                            <button onclick="openPhotoInbox()" title="กล่องรูป"
                                class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-emerald-400 transition">
                                <i class="fa-solid fa-images text-sm"></i>
                            </button>
                            <button onclick="deleteSession()" title="ลบ session"
                                class="p-2 rounded-lg bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition">
                                <i class="fa-solid fa-trash text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Messages -->
                    <div id="messages-container" class="flex-1 overflow-y-auto p-3 sm:p-5 space-y-3"></div>

                    <!-- Reply box -->
                    <div class="bg-slate-900 border-t border-slate-800 p-3 shrink-0">
                        <form id="reply-form" class="flex gap-2">
                            <textarea id="reply-input" rows="1" maxlength="1000"
                                placeholder="พิมพ์ข้อความตอบกลับ... (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)"
                                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400 resize-none max-h-32"
                                onkeydown="handleReplyKeydown(event)"></textarea>
                            <button type="submit"
                                class="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white px-4 rounded-xl font-bold transition active:scale-95 shadow-lg shadow-amber-500/30">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </form>
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <button onclick="insertQuick('สวัสดีครับ/ค่ะ 🙏')"
                                class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">สวัสดี</button>
                            <button onclick="insertQuick('ราคาซ่อมจะขึ้นอยู่กับรุ่นครับ ช่วยส่งรุ่นมาหน่อยครับ')"
                                class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">สอบถามรุ่น</button>
                            <button onclick="insertQuick('กรุณาส่งรูปมาดูหน่อยครับ/ค่ะ')"
                                class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">ขอรูป</button>
                            <button onclick="insertQuick('ใช้เวลา 30-60 นาทีครับ/ค่ะ')"
                                class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">แจ้งเวลา</button>
                            <button onclick="insertQuick('ขอบคุณที่ใช้บริการครับ/ค่ะ 🙏')"
                                class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">ขอบคุณ</button>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Mobile: hide list when chatting, show list otherwise -->
            <style>
                @media (max-width: 640px) {
                    body.chatting #sidebar {
                        display: none;
                    }

                    body.chatting #chat-panel {
                        display: flex !important;
                    }
                }
            </style>
        </div>
    </div>

    <!-- ===== PHOTO INBOX MODAL ===== -->
    <div id="photo-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-emerald-500/40 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div
                        class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center">
                        <i class="fa-solid fa-images text-white text-sm"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-emerald-300">กล่องรูปที่ส่งมา</h2>
                        <p class="text-[10px] text-slate-400" id="photo-count">...</p>
                    </div>
                </div>
                <button onclick="closePhotoInbox()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="photo-list" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div class="col-span-full text-center py-8 text-xs text-slate-500">
                    <i class="fa-solid fa-circle-notch animate-spin"></i> กำลังโหลด...
                </div>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast"
        class="fixed top-5 right-5 transform translate-y-[-160%] opacity-0 transition-all bg-slate-900 border border-amber-500/40 text-white px-4 py-3 rounded-xl shadow-2xl z-[60] flex items-center gap-3">
        <div id="toast-icon"
            class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0"><i
                class="fa-solid fa-check"></i></div>
        <div id="toast-message" class="text-sm"></div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {getDatabase, ref, onValue, push, set, update, get, remove, increment, off} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPlKQmGJZxWaea_6y-h5lRGL5PSGw861M",
            authDomain: "short-link-b5ee2.firebaseapp.com",
            databaseURL: "https://short-link-b5ee2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "short-link-b5ee2",
            storageBucket: "short-link-b5ee2.firebasestorage.app",
            messagingSenderId: "1069426525163",
            appId: "1:1069426525163:web:4b49c025fb5909b9ad4fae",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ===== STATE =====
        let allSessions = {};
        let currentSessionId = null;
        let sessionSearchQuery = '';
        let sessionFilter = 'all';
        let soundEnabled = localStorage.getItem('fuji_admin_sound') !== 'false';
        let audioCtx = null;
        let currentAdminEmail = '';
        let sessionsUnsub = null;
        let messagesUnsub = null;
        let photosUnsub = null;
        let knownMessageCounts = {}; // for sound detection per session
        let adminName = localStorage.getItem('fuji_admin_name') || 'แอดมินฟูจิ';

        // ===== AUDIO =====
        function getAudioCtx() {
            if (!audioCtx) {try {audioCtx = new (window.AudioContext || window.webkitAudioContext)();} catch (e) {return null;} }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playBeep(type = 'notify') {
            if (!soundEnabled) return;
            const ctx = getAudioCtx(); if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'notify') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'send') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }
            } catch (e) { }
        }
        window.toggleSound = function () {
            soundEnabled = !soundEnabled;
            localStorage.setItem('fuji_admin_sound', soundEnabled);
            document.getElementById('audio-toggle').innerHTML = soundEnabled
                ? '<i class="fa-solid fa-volume-high"></i> <span>เสียง</span>'
                : '<i class="fa-solid fa-volume-xmark"></i> <span>ปิดเสียง</span>';
            showToast(soundEnabled ? '🔊 เปิดเสียง' : '🔇 ปิดเสียง');
            if (soundEnabled) playBeep('notify');
        };
        if (!soundEnabled) {
            document.getElementById('audio-toggle').innerHTML = '<i class="fa-solid fa-volume-xmark"></i> <span>ปิดเสียง</span>';
        }

        // ===== TOAST =====
        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('translate-y-[-160%]', 'opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('translate-y-[-160%]', 'opacity-0'), 2500);
        }

        // ===== AUTH =====
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pwd = document.getElementById('login-password').value;
            const errBox = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> กำลังเข้า...';
            try {
                await signInWithEmailAndPassword(auth, email, pwd);
            } catch (err) {
                const msgs = {
                    'auth/invalid-email': 'อีเมลไม่ถูกต้อง',
                    'auth/user-not-found': 'ไม่พบผู้ใช้',
                    'auth/wrong-password': 'รหัสผ่านผิด',
                    'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
                    'auth/too-many-requests': 'ลองผิดหลายครั้ง กรุณารอสักครู่'
                };
                errBox.textContent = msgs[err.code] || ('เกิดข้อผิดพลาด: ' + err.message);
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ';
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentAdminEmail = user.email;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('admin-email-label').textContent = user.email;
                startSessionListener();
                startPhotoListener();
                // Ask admin name
                if (!adminName || adminName === 'แอดมินฟูจิ') {
                    const n = prompt('ชื่อแอดมินที่ใช้แสดงในแชท:', adminName);
                    if (n && n.trim()) {adminName = n.trim(); localStorage.setItem('fuji_admin_name', adminName);}
                }
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
                stopListeners();
            }
        });

        window.logout = async function () {
            if (!confirm('ออกจากระบบ?')) return;
            await signOut(auth);
        };

        // ===== LISTENERS =====
        function startSessionListener() {
            if (sessionsUnsub) return;
            const sessionsRef = ref(db, 'sessions');
            sessionsUnsub = onValue(sessionsRef, (snap) => {
                const data = snap.val() || {};
                const prev = allSessions;
                allSessions = data;

                // detect new unread increments for sound
                Object.entries(data).forEach(([id, s]) => {
                    const prevCount = (prev[id]?.unreadByAdmin || 0);
                    const newCount = (s.unreadByAdmin || 0);
                    if (newCount > prevCount && id !== currentSessionId) {
                        playBeep('notify');
                    }
                });

                renderSessionList();
                if (currentSessionId) renderChat(currentSessionId);
            });
        }

        function startPhotoListener() {
            if (photosUnsub) return;
            const photosRef = ref(db, 'photo_inbox');
            photosUnsub = onValue(photosRef, (snap) => {
                const data = snap.val() || {};
                const photos = Object.entries(data).map(([id, p]) => ({...p, id})).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                renderPhotoList(photos);
            });
        }

        function stopListeners() {
            if (sessionsUnsub) {off(ref(db, 'sessions')); sessionsUnsub = null;}
            if (photosUnsub) {off(ref(db, 'photo_inbox')); photosUnsub = null;}
            if (messagesUnsub) {messagesUnsub(); messagesUnsub = null;}
        }

        // ===== SESSION LIST =====
        window.filterSessions = function () {
            sessionSearchQuery = document.getElementById('search-sessions').value.trim().toLowerCase();
            renderSessionList();
        };
        window.setFilter = function (f) {
            sessionFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => {
                const active = b.dataset.filter === f;
                b.className = `filter-btn flex-1 text-[10px] py-1.5 rounded font-medium ${active ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-slate-800 text-slate-400 border border-slate-700'}`;
            });
            renderSessionList();
        };

        function timeAgo(ts) {
            if (!ts) return '—';
            const diff = Date.now() - ts;
            if (diff < 60000) return 'เมื่อกี้';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' นาที';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' ชม.';
            return Math.floor(diff / 86400000) + ' วัน';
        }

        function renderSessionList() {
            const container = document.getElementById('session-list');
            let entries = Object.entries(allSessions);

            // Filter
            if (sessionFilter === 'unread') entries = entries.filter(([, s]) => (s.unreadByAdmin || 0) > 0);
            else if (sessionFilter === 'online') entries = entries.filter(([, s]) => s.customerOnline === true);

            // Search
            if (sessionSearchQuery) {
                entries = entries.filter(([id, s]) => {
                    const lastMsg = Object.values(s.messages || {}).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))[0];
                    return id.toLowerCase().includes(sessionSearchQuery) || (lastMsg?.text || '').toLowerCase().includes(sessionSearchQuery);
                });
            }

            // Sort by lastActive
            entries.sort(([, a], [, b]) => (b.lastActive || 0) - (a.lastActive || 0));

            if (entries.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500 italic">ไม่มี session</div>`;
                document.getElementById('header-info').textContent = `${Object.keys(allSessions).length} sessions ทั้งหมด`;
                return;
            }

            document.getElementById('header-info').textContent = `${Object.keys(allSessions).length} sessions · ${Object.values(allSessions).filter(s => s.customerOnline).length} ออนไลน์`;

            container.innerHTML = entries.map(([id, s]) => {
                const lastMsgArr = Object.entries(s.messages || {}).map(([mid, m]) => ({...m, mid})).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                const lastMsg = lastMsgArr[0];
                const preview = lastMsg ? (lastMsg.sender === 'admin' ? '↩ ' : '') + (lastMsg.text || '').substring(0, 60) : '(ยังไม่มีข้อความ)';
                const unread = s.unreadByAdmin || 0;
                const isActive = id === currentSessionId;
                return `
                <div onclick="selectSession('${id}')" class="session-item ${isActive ? 'active' : ''} px-3 py-2.5 cursor-pointer border-b border-slate-800">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5">
                                ${s.customerOnline ? '<span class="w-2 h-2 bg-emerald-400 rounded-full shrink-0 online-dot"></span>' : '<span class="w-2 h-2 bg-slate-600 rounded-full shrink-0"></span>'}
                                <p class="font-mono text-[11px] text-cyan-300 truncate">${id.replace('sess_', '').substring(0, 12)}</p>
                            </div>
                            <p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(preview)}</p>
                            <p class="text-[9px] text-slate-600 mt-0.5">${timeAgo(s.lastActive)}</p>
                        </div>
                        ${unread > 0 ? `<span class="bg-rose-500 text-white text-[10px] font-bold rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center shrink-0 unread-pulse">${unread}</span>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        // ===== CHAT =====
        window.selectSession = function (id) {
            currentSessionId = id;
            document.body.classList.add('chatting');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('chat-panel').classList.remove('hidden');

            // Mark read
            update(ref(db, `sessions/${id}`), {unreadByAdmin: 0}).catch(() => { });

            // Update header
            document.getElementById('chat-session-id').textContent = id;
            renderChat(id);

            // Listen to messages
            if (messagesUnsub) {messagesUnsub(); messagesUnsub = null;}
            const msgRef = ref(db, `sessions/${id}/messages`);
            messagesUnsub = onValue(msgRef, () => {
                renderChat(id);
                update(ref(db, `sessions/${id}`), {unreadByAdmin: 0}).catch(() => { });
            });

            renderSessionList();
        };

        window.closeChat = function () {
            currentSessionId = null;
            document.body.classList.remove('chatting');
            document.getElementById('active-chat').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            if (messagesUnsub) {messagesUnsub(); messagesUnsub = null;}
            renderSessionList();
        };

        function renderChat(id) {
            const s = allSessions[id];
            if (!s) return;
            document.getElementById('chat-session-id').textContent = id;
            document.getElementById('chat-last-active').textContent = 'ใช้งานล่าสุด ' + timeAgo(s.lastActive) + ' · ' + (s.userAgent || '');
            document.getElementById('chat-online').classList.toggle('hidden', !s.customerOnline);

            const msgs = Object.entries(s.messages || {}).map(([mid, m]) => ({...m, mid})).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            const container = document.getElementById('messages-container');

            if (msgs.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-xs text-slate-500 italic">ยังไม่มีข้อความ</div>`;
                return;
            }

            container.innerHTML = msgs.map(m => {
                const isAdmin = m.sender === 'admin';
                const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit'}) : '';
                if (m.type === 'photo' && m.thumbnail) {
                    return `
                    <div class="flex ${isAdmin ? 'justify-end' : 'justify-start'} msg-in">
                        <div class="max-w-[75%] ${isAdmin ? 'bg-amber-500/15 border-amber-500/40' : 'bg-slate-800 border-slate-700'} border rounded-2xl p-2.5">
                            <div class="text-[10px] ${isAdmin ? 'text-amber-400' : 'text-cyan-400'} mb-1 font-bold">
                                ${isAdmin ? '↩ ' + (m.adminName || 'แอดมิน') : '👤 ลูกค้า'} · ${time}
                            </div>
                            <img src="${m.thumbnail}" class="rounded-lg mb-2 max-h-48 cursor-pointer" onclick="showFullPhoto('${m.photoId}')">
                            <p class="text-xs text-slate-200 whitespace-pre-wrap">${escapeHtml(m.text || '')}</p>
                        </div>
                    </div>`;
                }
                return `
                <div class="flex ${isAdmin ? 'justify-end' : 'justify-start'} msg-in">
                    <div class="max-w-[75%] ${isAdmin ? 'bg-amber-500 text-slate-900' : 'bg-slate-800 text-slate-200'} rounded-2xl px-3 py-2 text-sm">
                        <div class="text-[10px] ${isAdmin ? 'text-amber-900/70' : 'text-slate-500'} mb-0.5">
                            ${isAdmin ? '↩ ' + (m.adminName || 'แอดมิน') : '👤 ลูกค้า'} · ${time}
                        </div>
                        <p class="whitespace-pre-wrap break-words">${escapeHtml(m.text || '')}</p>
                    </div>
                </div>`;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        // ===== REPLY =====
        document.getElementById('reply-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentSessionId) return;
            const input = document.getElementById('reply-input');
            const text = input.value.trim();
            if (!text) return;
            try {
                await push(ref(db, `sessions/${currentSessionId}/messages`), {
                    sender: 'admin',
                    text: text,
                    type: 'text',
                    timestamp: Date.now(),
                    adminName: adminName,
                    adminEmail: currentAdminEmail,
                });
                await update(ref(db, `sessions/${currentSessionId}`), {
                    lastActive: Date.now(),
                    unreadByUser: increment(1),
                });
                input.value = '';
                input.style.height = 'auto';
                playBeep('send');
                renderChat(currentSessionId);
            } catch (err) {
                showToast('❌ ส่งไม่สำเร็จ: ' + err.message);
            }
        };

        window.handleReplyKeydown = function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('reply-form').requestSubmit();
            }
        };

        window.insertQuick = function (text) {
            const input = document.getElementById('reply-input');
            input.value = (input.value ? input.value + ' ' : '') + text;
            input.focus();
        };

        // auto-resize textarea
        document.getElementById('reply-input').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 128) + 'px';
        });

        // ===== DELETE =====
        window.deleteSession = async function () {
            if (!currentSessionId) return;
            if (!confirm(`ลบ session "${currentSessionId}" ทั้งหมด? การกระทำนี้ย้อนกลับไม่ได้`)) return;
            try {
                await remove(ref(db, `sessions/${currentSessionId}`));
                showToast('🗑 ลบแล้ว');
                closeChat();
            } catch (err) {showToast('❌ ' + err.message);}
        };

        // ===== PHOTO INBOX =====
        let cachedPhotos = [];
        function renderPhotoList(photos) {
            cachedPhotos = photos;
            document.getElementById('photo-count').textContent = `${photos.length} รูป`;
            const list = document.getElementById('photo-list');
            if (photos.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-slate-500 italic">ยังไม่มีรูป</div>`;
                return;
            }
            list.innerHTML = photos.map(p => `
            <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden cursor-pointer hover:border-emerald-500/60 transition" onclick="showFullPhotoFromCache('${p.id}')">
                <img src="${p.thumbnailBase64 || ''}" class="w-full h-32 object-cover">
                <div class="p-2">
                    <p class="text-[10px] text-cyan-300 font-bold truncate">${escapeHtml(p.deviceModel || '')}</p>
                    <p class="text-[9px] text-slate-500 truncate">${escapeHtml(p.symptom || '')}</p>
                    <p class="text-[9px] text-slate-600">${p.timestamp ? new Date(p.timestamp).toLocaleString('th-TH') : ''}</p>
                </div>
            </div>
        `).join('');
        }

        window.openPhotoInbox = function () {
            document.getElementById('photo-modal').classList.remove('hidden');
        };
        window.closePhotoInbox = function () {
            document.getElementById('photo-modal').classList.add('hidden');
        };
        window.showFullPhoto = function (photoId) {
            get(ref(db, `photo_inbox/${photoId}`)).then(snap => {
                const p = snap.val();
                if (p && p.fullBase64) {
                    const w = window.open('', '_blank');
                    w.document.write(`<title>${p.deviceModel || 'รูป'}</title><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${p.fullBase64}" style="max-width:100%;max-height:100vh"></body>`);
                }
            });
        };
        window.showFullPhotoFromCache = function (photoId) {
            const p = cachedPhotos.find(x => x.id === photoId);
            if (p && p.fullBase64) {
                const w = window.open('', '_blank');
                w.document.write(`<title>${p.deviceModel || 'รูป'}</title><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${p.fullBase64}" style="max-width:100%;max-height:100vh"></body>`);
            }
        };

        // ===== UTILS =====
        function escapeHtml(s) {const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;}
    </script>
</body>

</html>
